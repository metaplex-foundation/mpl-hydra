[package]
name = "mpl-hydra"
version = "0.5.0"
edition = "2021"
description = "Collective account pooling, fan out wallet, dao treasury, all of the things you need to FAN OUT"
authors = ["Metaplex Developers <dev@metaplex.com>"]
repository = "https://github.com/metaplex-foundation/mpl-hydra"
license-file = "../../LICENSE"
readme = "README.md"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
test-bpf = []
no-idl = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[lints.rust]
# The anchor and solana entrypoint macros emit feature cfg checks in the destination
# crate; declare them here so they are not reported as unexpected.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("anchor-debug", "no-log-ix-name", "custom-heap", "custom-panic"))',
] }

[dependencies]
anchor-lang = "0.32.2"
anchor-spl = "0.32.2"
spl-token = { version = "8.0.0", features = ["no-entrypoint"] }
mpl-token-metadata = "5.1.1"
