name: Deploy Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag (release/hydra@0.4.2) or commit to deploy
        required: true
        type: string
        default: main
      program:
        description: Program
        required: true
        default: hydra
        type: choice
        options:
          - hydra
      cluster:
        description: Cluster environment
        required: true
        default: devnet
        type: choice
        options:
          - devnet
          - mainnet-beta
      dry_run:
        description: Dry run
        required: false
        type: boolean
        default: false

env:
  CACHE: true

jobs:
  check_tag:
    name: "Check tag"
    runs-on: ubuntu-latest
    outputs:
      program: ${{ steps.set_program.outputs.program }}
      type: ${{ steps.set_program.outputs.type }}
    steps:
      - name: Check tag
        id: set_program
        run: |
          echo program="hydra" >> $GITHUB_OUTPUT
          if [[ "${{ inputs.git_ref }}" =~ ^release/hydra@* ]]; then
            echo type="release" >> $GITHUB_OUTPUT
          else
            echo type="ref" >> $GITHUB_OUTPUT
          fi

  build_programs:
    name: Programs
    uses: ./.github/workflows/build-programs.yml
    secrets: inherit
    needs: check_tag
    if: needs.check_tag.outputs.type == 'ref'
    with:
      git_ref: ${{ inputs.git_ref }}

  test_programs:
    name: Test Programs
    uses: ./.github/workflows/test-programs.yml
    secrets: inherit
    needs: [build_programs, check_tag]
    if: needs.check_tag.outputs.type == 'ref'
    with:
      program_matrix: '["${{ inputs.program }}"]'
      git_ref: ${{ inputs.git_ref }}

  test_js:
    name: JS client
    needs: [build_programs, check_tag]
    uses: ./.github/workflows/test-js-client.yml
    secrets: inherit
    if: needs.check_tag.outputs.type == 'ref'
    with:
      git_ref: ${{ inputs.git_ref }}

  deploy_program:
    name: Program / Deploy
    runs-on: ubuntu-latest
    needs: [check_tag, test_js, test_programs]
    if: |
      always()
      && (needs.test_js.result == 'success' || needs.test_js.result == 'skipped')
      && (needs.test_programs.result == 'success' || needs.test_programs.result == 'skipped')
    permissions:
      contents: write
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Load environment variables
        id: env_vars
        run: |
          # Allowlist instead of a blanket `cat .github/.env >> "$GITHUB_ENV"`
          # so a PR-editable key in `.github/.env` cannot inject arbitrary env
          # vars into subsequent steps.
          grep -E '^(CARGO_TERM_COLOR|RUST_VERSION|SOLANA_VERSION|SOLANA_VERIFY_VERSION|COMMIT_USER_NAME|COMMIT_USER_EMAIL|DEPLOY_SOLANA_VERSION)=' .github/.env >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              RUST_VERSION) printf 'rust_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
              DEPLOY_SOLANA_VERSION) printf 'deploy_solana_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < .github/.env

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ steps.env_vars.outputs.rust_version }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ steps.env_vars.outputs.deploy_solana_version }}
          cache: ${{ env.CACHE }}

      - name: Install solana-verify
        if: github.event.inputs.dry_run == 'false'
        uses: metaplex-foundation/actions/install-solana-verify@v1
        with:
          version: ${{ env.SOLANA_VERIFY_VERSION }}

      - name: Set RPC
        run: |
          # We do this if waterfall because github actions does not allow dynamic access to secrets
          if [ "${{ inputs.cluster }}" == "devnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.DEVNET_RPC }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.cluster }}" == "mainnet-beta" ]; then
            printf 'RPC=%s\n' "${{ secrets.MAINNET_RPC }}" >> "$GITHUB_ENV"
          else
            echo "Invalid cluster: ${{ inputs.cluster }}"
            exit 1
          fi

      - name: Identify Program
        env:
          HYDRA_ID: ${{ secrets.HYDRA_ID }}
          HYDRA_DEPLOY_KEY: ${{ secrets.HYDRA_DEPLOY_KEY }}
        run: |
          echo PROGRAM_NAME="hydra" >> $GITHUB_ENV
          echo PROGRAM_BINARY="mpl_hydra.so" >> $GITHUB_ENV
          echo PROGRAM_LIBRARY="mpl_hydra" >> $GITHUB_ENV
          echo PROGRAM_PACKAGE="mpl-hydra" >> $GITHUB_ENV
          printf '%s' "$HYDRA_ID" > ./program-id.json
          # Derive the program id pubkey from the canonical keypair so later
          # steps cannot drift from the deploy target.
          # solana-keygen pubkey only emits the public key, not the secret.
          echo "PROGRAM_ID=$(solana-keygen pubkey ./program-id.json)" >> $GITHUB_ENV

          if [ "${{ inputs.cluster }}" == "devnet" ]; then
            printf '%s' "$HYDRA_DEPLOY_KEY" > ./deployer-key.json
            echo DEPLOY_TYPE="direct" >> $GITHUB_ENV
          else
            echo DEPLOY_TYPE="squads" >> $GITHUB_ENV
            echo SQUADS_MULTISIG="${{ vars.SQUADS_MULTISIG }}" >> $GITHUB_ENV
            echo SQUADS_VAULT="${{ vars.SQUADS_VAULT }}" >> $GITHUB_ENV
            echo SQUADS_PROGRAM_INDEX="${{ vars.SQUADS_PROGRAM_INDEX }}" >> $GITHUB_ENV
          fi

      - name: Sanitize Ref
        id: sanitize
        shell: bash
        run: |
          REF="${{ inputs.git_ref }}"
          if [ -z "$REF" ]; then
            REF="default"
          fi
          SANITIZED=${REF//\//-}
          echo "sanitized=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Download program builds
        uses: actions/download-artifact@v4
        if: needs.check_tag.outputs.type == 'ref'
        with:
          name: program-builds-${{ steps.sanitize.outputs.sanitized }}

      - name: Download release asset
        uses: actions/github-script@v5
        id: get_release
        if: needs.check_tag.outputs.type == 'release'
        with:
          script: |
            const tag = "${{ inputs.git_ref }}";
            const assetName = "${{ env.PROGRAM_BINARY }}";

            // Fetch the release associated with the tag
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: tag
            });

            if (release.status !== 200) {
              throw new Error(`Failed to fetch release for tag ${tag}`);
            }

            const asset = release.data.assets.find(asset => asset.name === assetName);
            if (!asset) {
              throw new Error(`Asset ${assetName} not found in release tagged ${tag}`);
            }

            core.setOutput("url", asset.url);

      - name: Download the Selected Asset
        if: needs.check_tag.outputs.type == 'release'
        run: |
          mkdir -p ${{ github.workspace }}/programs/.bin
          curl -L -o ${{ github.workspace }}/programs/.bin/${{ env.PROGRAM_BINARY }} \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ steps.get_release.outputs.url }}"

      - name: Deploy Program
        if: github.event.inputs.dry_run == 'false' && env.DEPLOY_TYPE == 'direct'
        run: |
          echo "Deploying ${{ needs.check_tag.outputs.program }} to ${{ inputs.cluster }}"

          solana -v program deploy ./programs/.bin/${{ env.PROGRAM_BINARY }} \
            -u ${{ env.RPC }} \
            --program-id ./program-id.json \
            -k ./deployer-key.json \
            --max-sign-attempts 100 \
            --use-rpc

      # Squads-deployed clusters need the squads vault to sign the verified-build
      # PDA write, so export the instruction here and let the multisig execute it
      # alongside the upgrade.
      - name: Export verified-build PDA transaction
        if: github.event.inputs.dry_run == 'false' && env.DEPLOY_TYPE == 'squads'
        uses: metaplex-foundation/actions/verify-program@v1
        with:
          mode: export-pda-tx
          program-id-keypair: ./program-id.json
          uploader: ${{ env.SQUADS_VAULT }}
          rpc-url: ${{ env.RPC }}
          library-name: ${{ env.PROGRAM_LIBRARY }}
          package: ${{ env.PROGRAM_PACKAGE }}
          solana-version: ${{ env.SOLANA_VERSION }}
          repo-visibility: public
          submit-remote: false
          output-file: verify-pda-tx.b58

      - name: Deploy squads buffer
        if: github.event.inputs.dry_run == 'false' && env.DEPLOY_TYPE == 'squads'
        env:
          SQUADS_BOT_KEY: ${{ secrets.SQUADS_BOT_KEY }}
        run: |
          echo "Deploying buffer for ${{ inputs.program }} on ${{ inputs.cluster }}"
          printf '%s' "$SQUADS_BOT_KEY" > ./submitter-key.json

          BUFFER=$(solana program write-buffer -u ${{ env.RPC }} -k ./submitter-key.json --max-sign-attempts 100 --use-rpc ./programs/.bin/${{ env.PROGRAM_BINARY }} | awk '{print $2}')
          echo "Buffer: $BUFFER"

          solana program set-buffer-authority $BUFFER \
            --new-buffer-authority ${{ env.SQUADS_VAULT }} \
            -k ./submitter-key.json \
            -u ${{ env.RPC }}

          echo "BUFFER=$BUFFER" >> $GITHUB_ENV

      - name: Create Squads proposal
        if: github.event.inputs.dry_run == 'false' && env.DEPLOY_TYPE == 'squads'
        uses: metaplex-foundation/squads-program-upgrade@main
        with:
          network-url: ${{ env.RPC }}
          program-multisig: ${{ env.SQUADS_MULTISIG }}
          program-id: ${{ env.PROGRAM_ID }}
          program-index: ${{ env.SQUADS_PROGRAM_INDEX }}
          buffer: ${{ env.BUFFER }}
          spill-address: ${{ env.SQUADS_VAULT }}
          authority: ${{ env.SQUADS_VAULT }}
          name: "Deploy ${{ inputs.git_ref }}"
          keypair: ${{ secrets.SQUADS_BOT_KEY }}

      - name: Create env tag
        uses: actions/github-script@v7
        if: github.event.inputs.dry_run == 'false'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const refData = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: '${{ (needs.check_tag.outputs.type == 'release' && format('tags/{0}', inputs.git_ref)) || inputs.git_ref }}'
            });
            if (refData.status !== 200) {
              throw new Error('Failed to fetch existing tag');
            }
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ needs.check_tag.outputs.program }}-${{ inputs.cluster }}',
              sha: refData.data.object.sha
            }).catch(err => {
              if (err.status !== 422) throw err;
              github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/${{ needs.check_tag.outputs.program }}-${{ inputs.cluster }}',
                sha: refData.data.object.sha
              });
            })

      - name: Clean up signer files
        if: always()
        run: rm -f ./deployer-key.json ./program-id.json ./submitter-key.json
