name: Main

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CACHE: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.changes.outputs.any }}
      programs: ${{ steps.changes.outputs.programs }}
      program_matrix: ${{ steps.program_matrix.outputs.matrix }}
      js_client: ${{ steps.changes.outputs.js_client }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Load environment variables
        run: |
          # Allowlist instead of a blanket `cat .github/.env >> "$GITHUB_ENV"`
          # so a PR-editable key in `.github/.env` cannot inject arbitrary env
          # vars into subsequent steps.
          grep -E '^(CARGO_TERM_COLOR|PROGRAMS)=' .github/.env >> "$GITHUB_ENV"

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: .github/file-filters.yml

      - name: Filter program matrix
        id: program_matrix
        uses: metaplex-foundation/actions/filter-matrix@v1
        with:
          matrix: ${{ env.PROGRAMS }}
          changes: ${{ steps.changes.outputs.changes }}
          suffix: _program

  build_programs:
    name: Programs
    if: ${{ needs.changes.outputs.any == 'true' }}
    needs: changes
    uses: ./.github/workflows/build-programs.yml
    secrets: inherit

  test_programs:
    name: Programs
    if: ${{ needs.changes.outputs.programs == 'true' }}
    needs: changes
    uses: ./.github/workflows/test-programs.yml
    secrets: inherit
    with:
      program_matrix: ${{ needs.changes.outputs.program_matrix }}

  generate_clients:
    name: Generate clients
    if: ${{ needs.changes.outputs.any == 'true' }}
    needs: [changes, build_programs]
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Load environment variables
        run: |
          grep -E '^(CARGO_TERM_COLOR|NODE_VERSION|RUST_VERSION|SOLANA_VERSION|ANCHOR_VERSION|PROGRAMS)=' .github/.env >> "$GITHUB_ENV"

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential libudev-dev

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ env.SOLANA_VERSION }}
          cache: ${{ env.CACHE }}

      - name: Cache program dependencies
        if: env.CACHE == 'true'
        uses: metaplex-foundation/actions/cache-programs@v1

      # Hydra is an Anchor program, so `pnpm generate:idls` shells out to
      # `anchor idl build`. The version is pinned in `.github/.env` and must
      # match the `anchor-lang` version used by the program, otherwise the
      # generated IDL will not match the committed one.
      - name: Cache anchor CLI
        id: cache_anchor
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/anchor
          key: anchor-cli-${{ env.ANCHOR_VERSION }}-${{ runner.os }}-${{ env.RUST_VERSION }}

      - name: Install anchor CLI
        if: steps.cache_anchor.outputs.cache-hit != 'true'
        run: cargo install anchor-cli --version ${{ env.ANCHOR_VERSION }} --locked

      - name: Install Node.js
        uses: metaplex-foundation/actions/install-node-with-pnpm@v1
        with:
          version: ${{ env.NODE_VERSION }}
          cache: ${{ env.CACHE }}
          dependencies: true

      - name: Generate IDLs and clients
        run: pnpm generate

      - name: Show git status
        run: git status

      - name: Ensure working directory is clean
        run: test -z "$(git status --porcelain)"

  test_js:
    if: ${{ needs.changes.outputs.js_client == 'true' }}
    name: JS Client
    needs: [changes, generate_clients]
    uses: ./.github/workflows/test-js-client.yml
    secrets: inherit
