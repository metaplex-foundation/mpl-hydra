name: Verify Program

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Release tag, commit hash, or branch that was deployed
        required: true
        type: string
      program:
        description: Program
        required: true
        default: hydra
        type: choice
        options:
          - hydra
      cluster:
        description: Cluster environment
        required: true
        default: mainnet-beta
        type: choice
        options:
          - mainnet-beta
          - devnet

env:
  CACHE: true

jobs:
  verify_program:
    name: Program / Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}

      - name: Load environment variables
        id: env_vars
        run: |
          # Allowlist instead of a blanket `cat .github/.env >> "$GITHUB_ENV"`
          # so a PR-editable key in `.github/.env` cannot inject arbitrary env
          # vars into subsequent steps.
          grep -E '^(RUST_VERSION|SOLANA_VERSION|DEPLOY_SOLANA_VERSION|SOLANA_VERIFY_VERSION)=' .github/.env >> "$GITHUB_ENV"
          while IFS='=' read -r key value; do
            case "$key" in
              RUST_VERSION) printf 'rust_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
              DEPLOY_SOLANA_VERSION) printf 'deploy_solana_version=%s\n' "$value" >> "$GITHUB_OUTPUT" ;;
            esac
          done < .github/.env

      - name: Install Rust
        uses: metaplex-foundation/actions/install-rust@v1
        with:
          toolchain: ${{ steps.env_vars.outputs.rust_version }}

      - name: Install Solana
        uses: metaplex-foundation/actions/install-solana@v1
        with:
          version: ${{ steps.env_vars.outputs.deploy_solana_version }}
          cache: ${{ env.CACHE }}

      - name: Install solana-verify
        uses: metaplex-foundation/actions/install-solana-verify@v1
        with:
          version: ${{ env.SOLANA_VERIFY_VERSION }}

      - name: Set RPC
        run: |
          if [ "${{ inputs.cluster }}" == "mainnet-beta" ]; then
            printf 'RPC=%s\n' "${{ secrets.MAINNET_RPC }}" >> "$GITHUB_ENV"
          elif [ "${{ inputs.cluster }}" == "devnet" ]; then
            printf 'RPC=%s\n' "${{ secrets.DEVNET_RPC }}" >> "$GITHUB_ENV"
          else
            echo "Invalid cluster: ${{ inputs.cluster }}"
            exit 1
          fi

      - name: Identify Program
        env:
          HYDRA_ID: ${{ secrets.HYDRA_ID }}
        run: |
          printf 'PROGRAM_LIBRARY=%s\n' "mpl_hydra" >> "$GITHUB_ENV"
          printf 'PROGRAM_PACKAGE=%s\n' "mpl-hydra" >> "$GITHUB_ENV"
          printf '%s' "$HYDRA_ID" > ./program-id.json

      # Rebuilds the program deterministically and compares the local hash to
      # the on-chain hash without requiring an upgrade-authority signature.
      # `mpl-hydra` is a public repository, so the OtterSec public verifier can
      # be used (`submit-remote: true`).
      - name: Verify program
        uses: metaplex-foundation/actions/verify-program@v1
        with:
          mode: submit-remote-job
          program-id-keypair: ./program-id.json
          rpc-url: ${{ env.RPC }}
          library-name: ${{ env.PROGRAM_LIBRARY }}
          package: ${{ env.PROGRAM_PACKAGE }}
          solana-version: ${{ env.SOLANA_VERSION }}
          repo-visibility: public
          submit-remote: true

      - name: Clean up signer files
        if: always()
        run: rm -f ./program-id.json
